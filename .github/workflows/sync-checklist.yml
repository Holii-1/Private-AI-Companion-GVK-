name: Sync Checklist from Issue #1 to README

on:
  issues:
    types: [edited]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README.md checklist from Issue #1 body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, re

          body = os.environ.get("ISSUE_BODY", "").replace("\r\n", "\n")
          # Extract from first "### Етап 1" onwards and convert ### to ####
          idx = body.find("### Етап 1")
          if idx == -1:
              raise SystemExit("Checklist section not found in issue body")
          checklist = body[idx:].strip()
          checklist = re.sub(r"^### ", "#### ", checklist, flags=re.MULTILINE)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          new_readme = re.sub(
              r"<!-- CHECKLIST_START -->.*?<!-- CHECKLIST_END -->",
              f"<!-- CHECKLIST_START -->\n{checklist}\n<!-- CHECKLIST_END -->",
              readme,
              flags=re.DOTALL,
          )

          if new_readme != readme:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_readme)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: sync checklist progress from Issue #1 [skip ci]"
            git push
          fi
